# ============================================================
# FILE        : slam_params.yaml
# DESCRIPTION : SLAM configuration specific to AMR project.
#
# These values override the kit defaults in:
#   kit/slam_module/config/slam_params.yaml
#
# Tuned for warehouse environment:
#   - Long straight corridors → larger laser range
#   - Robot size 40x30cm → appropriate travel thresholds
# ============================================================

slam_toolbox:
  ros__parameters:
    use_sim_time: true

    # --- Mode ---
    # mapping      : build new map while exploring
    # localization : use existing saved map
    mode: mapping

    # --- Topics and frames ---
    # Must match namespaced topics from robot_base
    # robot_001 publishes on /robot_001/scan
    scan_topic:  /robot_001/scan
    odom_frame:  odom
    map_frame:   map
    base_frame:  base_footprint

    # --- Solver ---
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI

    # --- Map parameters ---
    # resolution: 5cm per pixel — good for warehouse aisles
    resolution: 0.05
    map_update_interval: 2.0

    # --- Movement thresholds ---
    # Robot must move this much before updating map
    minimum_travel_distance: 0.2    # meters
    minimum_travel_heading:  0.17   # radians (~10 degrees)

    # --- LiDAR range ---
    # Must match robot LiDAR max range (10m)
    max_laser_range: 10.0

    # --- Loop closure ---
    # Corrects drift when robot revisits same area
    do_loop_closing: true
    loop_search_maximum_distance: 3.0

    # --- Map saving ---
    map_file_name: ""   # set at runtime by navigation.py

    # --- Debug ---
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    transform_timeout: 0.2
    tf_buffer_duration: 30.0